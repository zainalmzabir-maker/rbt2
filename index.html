<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Retro Pixel Style -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
  <style>
    :root {
      --pixel-font: 'Press Start 2P', monospace;
      --mono-font: 'Share Tech Mono', monospace;
      --retro-font: 'VT323', monospace;
    }
    body {
      font-family: var(--mono-font);
      background-color: #08090d;
      color: #e0e6ed;
      overflow-x: hidden;
    }
    .font-pixel { font-family: var(--pixel-font); }
    .font-retro { font-family: var(--retro-font); }

    .crt-overlay {
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.22) 50%);
      background-size: 100% 4px;
      pointer-events: none;
    }

    canvas {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #11141c; }
    ::-webkit-scrollbar-thumb { background: #d9480f; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #ff6b4a; }

    @keyframes siren-blink {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 10px #ff0044); }
      50% { opacity: 0.2; filter: drop-shadow(0 0 2px #00d4ff); }
    }
    .siren-active {
      animation: siren-blink 0.5s infinite;
    }

    @keyframes question-appear {
      0% {
        opacity: 0;
        transform: translateY(-12px) scale(0.98);
        filter: brightness(1.5);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        filter: brightness(1);
      }
    }
    .animate-question-new {
      animation: question-appear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Kecerunan larut lembut di puncak api 60vh */
    .raging-inferno-fade {
      mask-image: linear-gradient(to top, rgba(0,0,0,1) 55%, rgba(0,0,0,0.7) 78%, transparent 100%);
      -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 55%, rgba(0,0,0,0.7) 78%, transparent 100%);
    }
  </style>
</head>
